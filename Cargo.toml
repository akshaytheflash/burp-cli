[package]
name = "burp-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "A Burp Suite-style HTTP security testing toolkit for the terminal"
license = "MIT"
readme = "README.md"
keywords = ["security", "http", "proxy", "scanner", "pentest"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "burpcli"
path = "src/main.rs"

[lib]
name = "burpcli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ctrlc = "3"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
percent-encoding = "2"
rand = "0.8"
rcgen = { version = "0.13", features = ["x509-parser"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
toml = "0.8"
url = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
